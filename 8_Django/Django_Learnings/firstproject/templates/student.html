<style>
    table {
        width: 50%;
        border-collapse: collapse;
        font-family: Arial, sans-serif;
    }

    th {
        background-color: #198754; /* Green */
        color: white;
        padding: 10px;
    }

    td {
        padding: 10px;
        text-align: center;
    }

    tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    tr:nth-child(odd) {
        background-color: #ffffff;
    }

    tr:hover {
        background-color: #d1ecf1;
    }

    table, th, td {
        border: 1px solid #333;
    }

    h3 {
        color: #198754;
    }
</style>

<h3>Student Details</h3>

<table>
    <tr>
        <th>ID</th>
        <th>NAME</th>
        <th>AGE</th>
        <th>ADDRESS</th>
        <th>DEPARTMENT</th>
    </tr>

    {% for s in student %}
    <tr>
        <td>{{ s.id }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.age }}</td>
        <td>{{ s.address }}</td>
        <td>{{ s.department }}</td>
    </tr>
    {% endfor %}
</table>
