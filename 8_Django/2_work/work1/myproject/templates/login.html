<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

</head>

            
<body class="d-flex flex-column min-vh-100"
      style="background-image: url('https://images.unsplash.com/photo-1754516733606-008062751e0f?q=80&w=1170&auto=format&fit=crop');
             background-size: cover;
             background-position: center;
             background-repeat: no-repeat;
             background-attachment: fixed;">


<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0a3622;">  <div class="container-fluid">
    <a class="navbar-brand" href="#"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
<div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ms-auto">
        <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'mainpage' %}">Back</a>
        </li>
    </ul>
</div>
  </div>
</nav>

<div class="container d-flex justify-content-center align-items-center flex-grow-1">

    <div class="card p-4 shadow-lg text-white" 
         style="width: 400px; background-color: rgba(13, 71, 9, 0.26);">

        <h2 class="text-center mb-4" style="color:#ffffff;">
            Login
        </h2>

        <form>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" 
                       class="form-control" 
                       placeholder="Enter username">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" 
                       class="form-control" 
                       placeholder="Enter password">
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input">
                <label class="form-check-label">
                    Remember me
                </label>
            </div>

            <button type="submit" 
                    class="btn w-100 text-white"
                    style="background-color:#0a3622;">
                Login
            </button>

        </form>

        <p class="text-center mt-3">
            Don't have an account?
            <a href="/register/" class="text-white">
                Register
            </a>
        </p>

    </div>

</div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</html>
