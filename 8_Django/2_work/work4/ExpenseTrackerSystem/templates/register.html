<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Expense Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet">


    <style>

        :root {
            --bg: #08080D;
            --card: #15141F;
            --card-hover: #1C1B27;
            --border: #292735;

            --text: #F5F5F7;
            --muted: #92909D;

            --teal: #00D4C7;
            --cyan: #19C7D8;

            --danger: #FF5C7A;
        }


        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family: 'Poppins', sans-serif;

            background:
                radial-gradient(
                    circle at 80% 10%,
                    rgba(0, 212, 199, 0.10),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 10% 90%,
                    rgba(25, 199, 216, 0.06),
                    transparent 30%
                ),

                var(--bg);

            color: var(--text);
        }


        .register-box {

            width: min(100%, 430px);

            padding: 38px 35px;

            background:
                linear-gradient(
                    145deg,
                    #171620,
                    #111018
                );

            border: 1px solid var(--border);

            border-radius: 16px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }


        .logo {

            width: 50px;

            height: 50px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    var(--teal),
                    var(--cyan)
                );

            color: #08080D;

            font-size: 24px;

            box-shadow:
                0 0 25px rgba(0, 212, 199, 0.20);
        }


        h2 {

            margin: 0 0 7px;

            color: var(--text);

            font-size: 28px;

            font-weight: 600;

            text-align: center;
        }


        .subtitle {

            margin: 0 0 28px;

            color: var(--muted);

            font-size: 13px;

            text-align: center;
        }


        form p {

            margin: 0 0 17px;
        }


        form label {

            display: block;

            margin-bottom: 7px;

            color: var(--muted);

            font-size: 12px;

            font-weight: 500;
        }


        input {

            width: 100%;

            padding: 12px 13px;

            background: #0F0F17;

            border: 1px solid var(--border);

            border-radius: 9px;

            color: var(--text);

            font-family: 'Poppins', sans-serif;

            font-size: 13px;

            outline: none;

            transition: 0.25s;
        }


        input:focus {

            background: #11111A;

            border-color: var(--teal);

            box-shadow:
                0 0 0 3px rgba(0, 212, 199, 0.08);
        }


        input::placeholder {

            color: #5F5D6A;
        }


        .helptext {

            display: none !important;
        }


        .errorlist {

            list-style: none;

            padding: 0;

            margin: 5px 0 10px;

            color: var(--danger);

            font-size: 11px;
        }


        button {

            width: 100%;

            margin-top: 8px;

            padding: 12px;

            border: none;

            border-radius: 9px;

            color: #08080D;

            cursor: pointer;

            font-family: 'Poppins', sans-serif;

            font-size: 13px;

            font-weight: 600;

            background:
                linear-gradient(
                    135deg,
                    var(--teal),
                    var(--cyan)
                );

            transition: 0.25s;
        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0, 212, 199, 0.20);
        }


        .login-link {

            margin: 22px 0 0;

            padding-top: 20px;

            border-top: 1px solid var(--border);

            color: var(--muted);

            font-size: 13px;

            text-align: center;
        }


        .login-link a {

            color: var(--teal);

            font-weight: 600;

            text-decoration: none;
        }


        .login-link a:hover {

            color: var(--cyan);

            text-decoration: underline;
        }


        @media (max-width: 450px) {

            body {

                padding: 15px;
            }

            .register-box {

                padding: 30px 22px;
            }

            h2 {

                font-size: 25px;
            }
        }

    </style>

</head>


<body>


<div class="register-box">


    <div class="logo">

        <i class="bi bi-wallet2"></i>

    </div>


    <h2>
        Create Account
    </h2>


    <p class="subtitle">
        Start tracking your expenses today
    </p>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <button type="submit">

            <i class="bi bi-person-plus"></i>

            Register

        </button>

    </form>


    <p class="login-link">

        Already have an account?

        <a href="{% url 'loginpage' %}">
            Login
        </a>

    </p>


</div>


</body>

</html>
