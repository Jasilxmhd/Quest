<!DOCTYPE html>
<html>
<head>
    <title>Delete Category</title>
</head>

<body>

    <h1>Delete Category</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ category.name }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>

    <br>

    <a href="{% url 'category_list' %}">
        Cancel
    </a>

</body>
</html>
