<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Expense</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        :root {
            --bg: #08080D;
            --card: #15141F;
            --border: #292735;
            --text: #F5F5F7;
            --muted: #92909D;
            --danger: #FF5C7A;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background:
                radial-gradient(
                    circle at 80% 10%,
                    rgba(255, 92, 122, 0.08),
                    transparent 30%
                ),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .delete-card {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 35px;
            text-align: center;
        }

        .icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(255, 92, 122, 0.1);
            color: var(--danger);

            font-size: 25px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
        }

        p {
            color: var(--muted);
            font-size: 13px;
        }

        .expense-name {
            color: var(--text);
            font-weight: 600;
        }

        .btn-delete {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 11px 22px;
            font-weight: 600;
        }

        .btn-delete:hover {
            background: #ff7890;
        }

        .btn-cancel {
            color: var(--text);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 11px 22px;
            text-decoration: none;
        }

        .btn-cancel:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

    </style>

</head>

<body>

<div class="page">

    <div class="delete-card">

        <div class="icon">
            🗑
        </div>

        <h1>
            Delete Expense?
        </h1>

        <p>
            Are you sure you want to delete
            <span class="expense-name">
                "{{ expense.title }}"
            </span>?
        </p>

        <p>
            This action cannot be undone.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="d-flex justify-content-center gap-2 mt-4">

                <button type="submit"
                        class="btn-delete">

                    Delete Expense

                </button>

                <a href="{% url 'expense_list' %}"
                   class="btn-cancel">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
