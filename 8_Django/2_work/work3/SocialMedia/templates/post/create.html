<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Title</label>
    <input type="text" name="title">

    <label>Description</label>
    <input type="text" name="description">

    <label>Image</label>
    <input type="file" name="image">

    <button type="submit">Create</button>


</form>
