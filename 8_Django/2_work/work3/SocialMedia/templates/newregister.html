
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef4ff;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            width: 400px;
            background: white;
            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #082976;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #082976;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #082976;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #061e59;
        }

        .login-text {
            margin-top: 20px;
            text-align: center;
            color: #777;
        }

        .login-text a {
            color: #082976;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2>Registration Form</h2>

        <p class="description">
            Create your account
        </p>

        <form>

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm your password">
            </div>

            <button type="submit">
                Register
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="newlogin.html">Login</a>
        </p>

    </div>

</body>
</html>
