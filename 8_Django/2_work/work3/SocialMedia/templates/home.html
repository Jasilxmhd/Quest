<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">

    <style>
        *{
            box-sizing: border-box;
            margin:0;
            padding:0;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:"DM Sans", Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(60,208,139,.22), transparent 28%),
                linear-gradient(135deg,#e8f3ec,#d8eadf);
        }

        .welcome-box{
            width:min(100%,420px);
            background:#fff;
            border-radius:16px;
            padding:45px 35px;
            text-align:center;
            border:1px solid rgba(11,105,71,.12);
            box-shadow:0 16px 38px rgba(0,35,24,.28);
        }

        h1{
            color:#07583b;
            font-family:"Playfair Display", Georgia, serif;
            font-size:42px;
            font-style:italic;
            margin-bottom:15px;
        }

        .username{
            color:#0b6947;
            font-size:22px;
            font-weight:700;
            margin-bottom:30px;
        }

        button{
            width:100%;
            padding:13px;
            border:none;
            border-radius:7px;
            cursor:pointer;
            color:#fff;
            font-family:inherit;
            font-size:16px;
            font-weight:700;
            background:linear-gradient(90deg,#063c29,#0b6947,#2b8b65);
            transition:.25s ease;
        }

        button:hover{
            transform:translateY(-2px);
            background:linear-gradient(90deg,#03291b,#07583b,#167852);
        }

        .message{
            margin-top:20px;
            color:#527064;
            font-size:15px;
        }
    </style>
</head>
<body>

<div class="welcome-box">

    <h1>Welcome</h1>

    <div class="username">
        {{ user.username }}
    </div>

    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>

    <p class="message">
        You have successfully logged in.
    </p>

</div>

</body>
</html>
