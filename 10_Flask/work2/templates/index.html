<table border = "1">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
        <th>Age</th>
    </tr>

    {% for s in students %}

    <tr>
        <td>{{ s.name }}</td>
        <td>{{ s.email }}</td>
        <td>{{ s.course }}</td>
        <td>{{ s.age }}</td>
    </tr>

    {% endfor %}
</table>
