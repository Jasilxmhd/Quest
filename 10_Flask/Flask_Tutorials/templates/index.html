
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flask Tutorial</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
        }

        nav {
            background: #1c1c1c;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #aaa;
        }

        .content {
            text-align: center;
            padding: 120px 20px;
        }

        .content h1 {
            font-size: 45px;
        }

        .content p {
            color: #aaa;
            font-size: 18px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            border-top: 1px solid #333;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            Flask Tutorial
        </div>

        <div class="nav-links">
            <a href="/home">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </div>

    </nav>


    <div class="content">

        <h1>Welcome to Flask</h1>

        <p>
            This is a simple Flask HTML page.
        </p>

    </div>


    <footer>
        © 2026 Flask Tutorial
    </footer>

</body>

</html>
